<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>ثبت‌نام دانشجو جدید</title>
</head>
<body>
  <h2>فرم ثبت‌نام دانشجو</h2>
  <form id="studentForm">
    <label>نام و نام خانوادگی: <input type="text" id="fullName" required></label><br>
    <label>شماره دانشجویی: <input type="text" id="studentId" required></label><br>
    <label>رشته تحصیلی: <input type="text" id="major" required></label><br>
    <button type="submit">ثبت دانشجو</button>
  </form>
</body>
</html>
